name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"     # every Monday: check EIA for new monthly import data
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write   # to save new import data back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update US crude imports data from EIA
        id: imports
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_imports.py

      - name: Save new data to the repo
        if: steps.imports.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/imports.json site/imports.html site/sitemap.xml
          git commit -m "Update US crude imports data" || exit 0
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
